appId: tech.sombrasol.guard
productName: Sombrasol Guard
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: resources
    to: .
    filter:
      - offline.html
      - icon.png
win:
  target: nsis
  artifactName: Sombrasol-Guard-Setup.${ext}
  icon: build/icon.ico
  # Code signing (add later, no structural change):
  #   certificateFile: build/cert.pfx
  #   certificatePassword: ${env.CSC_KEY_PASSWORD}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  # Repo is public — no token needed at runtime to READ the feed.
  # releaseType: release publishes a non-draft release so both auto-update
  # (electron-updater reads latest.yml) and the /latest/download/ link resolve.
  provider: github
  owner: FrancoM66
  repo: sombrasol-desktop
  releaseType: release
